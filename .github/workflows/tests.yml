name: Test source changes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m py_compile vpngate_manager.py vpn_utils.py proxy_server.py snapshot_utils.py manual_target.py proxyctl.py official_web.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate installation script
        run: bash -n install.sh
      - name: Validate Docker Compose configuration
        run: |
          docker compose -f compose.yaml config >/dev/null
          LOCAL_PROXY_USER=validation LOCAL_PROXY_PASS=validation docker compose -f compose.manual.yaml config >/dev/null
      - name: Build source archive
        run: python scripts/build_release_archives.py --output-dir dist
