name: Validate changes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: python -m py_compile *.py scripts/*.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh && docker compose config --quiet
      - run: python scripts/build_release_archives.py --output-dir dist
