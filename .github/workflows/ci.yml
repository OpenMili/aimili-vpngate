name: Validate changes

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: python -m py_compile *.py scripts/*.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh && docker compose config --quiet
      - run: python scripts/build_release_archives.py --output-dir dist
      - run: bash -n dist/install.sh && bash -n dist/install-source.sh && bash -n dist/install-docker.sh

  smoke-published-installers:
    # Exercise the real public downloads on disposable VMs after a release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        installer: [source, docker]
    steps:
      - name: Download and install the public release
        env:
          INSTALLER: ${{ matrix.installer }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo aimili.sh https://github.com/OpenMili/aimili-vpngate/releases/latest/download/install.sh
          log=$(mktemp)
          python3 -m http.server 8787 --bind 127.0.0.1 --directory /usr/share/empty > /dev/null 2>&1 &
          occupied=$!
          trap 'kill "$occupied" 2>/dev/null || true; rm -f "$log"' EXIT
          for _ in {1..30}; do curl --noproxy '*' -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 0.2; done
          kill -0 "$occupied"
          choice=1
          if [[ $INSTALLER == docker ]]; then choice=2; fi
          if ! printf '%s\n' "$choice" | sudo env AIMILIVPN_PUBLIC_HOST=127.0.0.1 bash aimili.sh > "$log" 2>&1; then
            grep -Ei 'error|failed|错误|失败|缺少|未就绪' "$log" | tail -15 || true
            exit 1
          fi
          if [[ $INSTALLER == source ]]; then
            systemctl is-active --quiet aimilivpn.service
            read_config=(sudo cat /opt/aimilivpn/vpngate_data/ui_auth.json)
            read_boot=(sudo cat /opt/aimilivpn/vpngate_data/ui_bootstrap.json)
          else
            test "$(docker inspect --format '{{.State.Health.Status}}' aimilivpn)" = healthy
            read_config=(docker exec aimilivpn cat /data/ui_auth.json)
            read_boot=(docker exec aimilivpn cat /data/ui_bootstrap.json)
            docker exec aimilivpn touch /data/installer-smoke-marker
          fi
          test "$("${read_config[@]}" | jq -r .host)" = 0.0.0.0
          port=$("${read_config[@]}" | jq -r .port)
          test "$port" = 8788
          path=$("${read_config[@]}" | jq -r .secret_path)
          grep -Fq "http://127.0.0.1:$port/$path/" "$log"
          for key in username password; do
            value=$("${read_boot[@]}" | jq -er ".$key")
            test -n "$value"
            grep -Fq -- "$value" "$log"
          done
          curl --noproxy '*' -fsS "http://127.0.0.1:$port/$path/" -o "$RUNNER_TEMP/login.html"
          grep -Fq 'type="password"' "$RUNNER_TEMP/login.html"
          "${read_boot[@]}" | jq -c '{username,password}' | curl --noproxy '*' -fsS -H 'Content-Type: application/json' --data-binary @- "http://127.0.0.1:$port/$path/api/login" | jq -e '.ok == true' >/dev/null
          before=$("${read_config[@]}" | jq -c '[.host,.port,.username,.secret_path,.password_hash]')
          sudo bash aimili.sh "--$INSTALLER" > "$log" 2>&1
          after=$("${read_config[@]}" | jq -c '[.host,.port,.username,.secret_path,.password_hash]')
          test "$before" = "$after"
          if [[ $INSTALLER == docker ]]; then docker exec aimilivpn test -f /data/installer-smoke-marker; fi
          sudo bash aimili.sh --purge
          sudo bash aimili.sh --purge
          test ! -e /opt/aimilivpn-docker && test ! -e /opt/aimilivpn
          if docker container inspect aimilivpn >/dev/null 2>&1; then exit 1; fi
          if docker volume inspect aimilivpn-docker_aimilivpn-data >/dev/null 2>&1; then exit 1; fi
          kill -0 "$occupied"

  smoke-legacy-purge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clean up a v2.1.6 host with both packages installed
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://github.com/OpenMili/aimili-vpngate/releases
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          for kind in docker source; do
            curl -fsSLo "install-$kind.sh" "$base/download/v2.1.6/install-$kind.sh"
            # Both old packages create files even when their listeners collide.
            if ! sudo env AIMILIVPN_NONINTERACTIVE=1 NEEDRESTART_MODE=l bash "install-$kind.sh" > "$log" 2>&1; then
              test "$kind" = source && sudo test -f /opt/aimilivpn/vpngate_manager.py
            fi
          done
          sudo test -x /usr/bin/ml && sudo test -d /opt/aimilivpn-docker
          docker volume inspect aimilivpn-docker_aimilivpn-data >/dev/null
          docker volume create unrelated-smoke-data >/dev/null
          docker create --name unrelated-smoke-container ghcr.io/openmili/aimili-vpngate:2.1.6 true >/dev/null
          sudo install -m 600 install-source.sh /root/install-source.sh
          curl -fsSLo aimili.sh "$base/latest/download/install.sh"
          sudo bash aimili.sh --purge
          sudo test ! -e /root/install-source.sh
          test ! -e /usr/bin/ml && test ! -e /opt/aimilivpn && test ! -e /opt/aimilivpn-docker
          if docker container inspect aimilivpn >/dev/null 2>&1; then exit 1; fi
          if docker volume inspect aimilivpn-docker_aimilivpn-data >/dev/null 2>&1; then exit 1; fi
          docker container inspect unrelated-smoke-container >/dev/null
          docker volume inspect unrelated-smoke-data >/dev/null
