name: Publish formal release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing formal tag to publish (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: formal-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    # setup-python provides Python 3.9 builds for Ubuntu 24.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify formal version tag
        shell: bash
        run: test "${RELEASE_TAG}" = "v$(tr -d '\r\n' < VERSION)"
      - name: Compile Python sources
        run: python -m py_compile *.py scripts/*.py
      - name: Validate installation script
        run: bash -n install.sh
      - name: Validate Docker Compose configuration
        run: docker compose -f compose.yaml config >/dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker-smoke:
    name: Smoke test Docker ${{ matrix.slug }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/386
            slug: 386
          - platform: linux/arm64
            slug: arm64
          - platform: linux/arm/v7
            slug: armv7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build architecture image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          build-args: BUILD_VERSION=${{ env.RELEASE_TAG }}
          tags: aimilivpn-smoke:${{ matrix.slug }}
          cache-from: type=gha,scope=smoke-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.slug }}
      - name: Verify proxy health-check dependency and application imports
        shell: bash
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            "aimilivpn-smoke:${{ matrix.slug }}" sh -ec '
              command -v curl
              command -v ping
              python3 -c "import vpngate_manager as app; print(app.APP_VERSION)"
            '

  docker:
    name: Publish multi-architecture Docker image
    permissions:
      contents: read
      packages: write
    needs: docker-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          minor="$(printf '%s' "${version}" | cut -d. -f1,2)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "minor=${minor}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - name: Build and publish Docker manifest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          build-args: BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.minor }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Publish universal Python source release
    permissions:
      contents: write
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Build universal Linux source archive
        run: python scripts/build_release_archives.py --output-dir dist
      - name: Create GitHub formal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="AimiliVPN V$(tr -d '\r\n' < VERSION) 正式版"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --title "${title}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${title}" --notes-file RELEASE_NOTES.md --verify-tag --latest
          fi
